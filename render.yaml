services:
  - type: web
    name: english-trainer-be
    runtime: node
    rootDir: BE
    buildCommand: npm install
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: CLIENT_URL
        value: https://english-trainer-by-ai-vanh260703s-projects.vercel.app
